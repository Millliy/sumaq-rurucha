<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi pedido - Sumaq Rurucha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@400;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header data-nav></header>

  <main class="track-order-page">
    <section class="track-order" aria-labelledby="track-order-title">
      <div class="track-order__icon">
        <img src="assets/icons/envio.svg" alt="">
      </div>

      <p class="eyebrow">RASTREA TU PEDIDO</p>
      <h1 id="track-order-title">&iquest;D&oacute;nde est&aacute; mi pedido?</h1>
      <p class="track-order__subtext">Ingresa tu n&uacute;mero de pedido y el correo o tel&eacute;fono con el que compraste.</p>

      <form class="track-order-card" data-track-order-form novalidate>
        <label class="track-order-field" data-track-order-field="orderNumber">
          <span>N&uacute;mero de pedido</span>
          <input type="text" name="orderNumber" placeholder="Ej. SR-48213" autocomplete="off">
        </label>

        <label class="track-order-field" data-track-order-field="contact">
          <span>Correo o tel&eacute;fono</span>
          <input type="text" name="contact" placeholder="Ej. maria@gmail.com" autocomplete="off">
        </label>

        <p class="track-order-error" data-track-order-error hidden>
          No encontramos un pedido con esos datos. Revisa el n&uacute;mero y el correo/tel&eacute;fono.
        </p>

        <button class="button button--primary" type="submit">Buscar mi pedido &rarr;</button>

        <div class="track-order-demo">
          <p>&iquest;Solo quieres verlo en acci&oacute;n? Prueba un pedido de ejemplo:</p>
          <div class="track-order-demo__options">
            <button type="button" class="track-order-demo__fill" data-demo-order="SR-10001">Confirmado</button>
            <button type="button" class="track-order-demo__fill" data-demo-order="SR-10002">Preparando</button>
            <button type="button" class="track-order-demo__fill" data-demo-order="SR-48213">En camino</button>
            <button type="button" class="track-order-demo__fill" data-demo-order="SR-10004">Entregado</button>
          </div>
        </div>
      </form>

      <div class="track-order-divider"><span>&iquest;YA TIENES CUENTA?</span></div>

      <a class="button button--outline" href="#">Iniciar sesi&oacute;n</a>
    </section>
  </main>

  <div data-footer></div>

  <script src="js/productos-data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
